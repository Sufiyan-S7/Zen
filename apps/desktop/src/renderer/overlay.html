<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Zen</title>
<link rel="stylesheet" href="overlay.css" />
</head>
<body>
  <div class="overlay-card" id="overlay-card">
    <div class="overlay-mark">Z</div>
    <input
      id="overlay-input"
      class="overlay-input"
      type="text"
      placeholder="Ask Zen..."
      autocomplete="off"
      spellcheck="false"
    />
    <div id="overlay-waveform" class="overlay-waveform" hidden aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <button id="overlay-mic" class="overlay-mic" type="button" title="Hold to speak" disabled>&#127908;</button>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
