<!DOCTYPE html>
<!--
  Block G, Step 27: the required visible "Zen is active" indicator, shown only while the owner
  has opted into "use my current window" browser handoff. Passive only -- no script, no preload,
  no IPC. main.js sets ignoreMouseEvents(true) on this window so it never intercepts a click.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: transparent;
    font-family: -apple-system, "Segoe UI", sans-serif;
    -webkit-app-region: no-drag;
  }
  .badge {
    display: flex; align-items: center; gap: 8px;
    height: 100%; box-sizing: border-box;
    padding: 0 14px;
    background: #3a1f00;
    border: 1px solid #d97706;
    border-radius: 8px;
    color: #fde68a;
    font-size: 13px;
    font-weight: 600;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #f59e0b;
    box-shadow: 0 0 6px 2px rgba(245, 158, 11, 0.6);
  }
</style>
</head>
<body>
  <div class="badge"><span class="dot"></span>Zen is active in this window</div>
</body>
</html>
